# Shared and platform-specific features for MobileApplication structured data (1.5.0: the basic remote is free).
features:
- Wi-Fi TV remote for Samsung, LG, Roku, Fire TV, Android TV, Google TV, Vizio, Sony,
  Panasonic, Xiaomi, Hisense and Philips TVs, and Apple TV
- 'Free basic remote: directional pad, OK, Back, Home, volume, mute, channel, power
  and playback keys'
- Automatic TV discovery on the local network, and adding a TV by IP address
- Turning a TV on over Wi-Fi
- Tune-up guides for the TV's own privacy, ad, picture and sound settings, with Camera
  Assist
- Simple layout with big keys
- 'TameTV Pro: voice search, phone keyboard, apps in one tap and swipe touchpad'
- 'TameTV Pro: casting photos, slideshows, videos, files and links'
- 'TameTV Pro: Quiet Ads, number keys and inputs, Find Remote and a sleep timer'
- No account, no ads and no infrared blaster
android_features:
- Demo TV on Android
- Guide to Android system screen casting on compatible phones and TVs
ios_features:
- Demo TV and iPad split-view layout
- 'TameTV Pro: Lock Screen remote, Help Family over FaceTime, Siri and Shortcuts'
- Guide to AirPlay mirroring on compatible TVs
