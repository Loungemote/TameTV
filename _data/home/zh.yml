privacy:
  title: 从设计上<em>保护隐私</em>。
  lead: 遥控器没有理由知道你是谁。TameTV 没有账号，也没有自己的服务器，遥控指令直接从手机发到电视。
  link: 阅读隐私政策（英文）
  items:
    - { icon: "useroff", title: "无需账号", text: "不用注册，不用邮箱，没有需要登录的东西。" }
    - { icon: "eyeoff", title: "没有广告", text: "没有广告代码，不使用广告标识符。" }
