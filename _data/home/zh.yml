faq:
  title: 常见问题
  more: 还有其他问题？请发邮件至
  items:
    - q: "TameTV 免费吗？"
      a: "免费。基础遥控器不收费，没有广告，也没有试用期限。方向键、OK、返回、主页、音量、静音、频道、电源和播放键、简洁布局、调校以及相机辅助的引导模式都免费。TameTV Pro 增加语音搜索、手机键盘、应用、触控板、投屏、广告小声点等功能，可选周订阅（符合条件的新订阅用户免费试用 3 天）、年订阅或一次性终身买断。价格和优惠在付款前显示。"
    - q: "支持哪些电视？"
      a: "Samsung 智能电视（2010 至 2013 年，以及 2016 年起）、LG webOS 电视、Sony Bravia、2011 年起的 Panasonic VIERA、搭载 PatchWall 的 Xiaomi 电视、搭载 VIDAA 的 Hisense 电视、搭载 Titan OS 或 Saphi 的 Philips 电视、Android TV 和 Google TV 设备、Roku、Amazon Fire TV、Vizio SmartCast，以及 Apple TV HD 和 Apple TV 4K。TCL、Insignia、Toshiba、Sharp 等其他品牌的 Roku TV、Google TV 和 Fire TV 机型同样适用。不支持 2014 和 2015 年的 Samsung 电视，也不支持只能用红外遥控的电视。"
    - q: "App 找不到电视怎么办？"
      a: "让电视保持开机，并和手机连接同一个 Wi-Fi；访客网络可能会阻止设备发现。Android 上，在 App 请求时允许“附近的设备”。iOS 上，在“设置 > 隐私与安全性 > 本地网络”中打开 TameTV。仍然找不到时，在 App 里选择电视品牌，看看要打开哪个设置，或者按 IP 地址添加电视。"
    - q: "能用手机打开电视吗？"
      a: "很多电视可以。先在电视上打开网络唤醒设置，例如 Samsung 的 Power On with Mobile、LG 的 Turn on via Wi-Fi、Roku TV 的 Fast TV start、Panasonic 的 Powered On by Apps。2010 至 2013 年的 Samsung 电视无法通过网络开机。"
    - q: "调校会改动我的电视吗？"
      a: "它自己不会改动任何设置。调校会显示每项设置的菜单路径，例如分享观看内容的那一项，并说明关掉它会失去什么。由你用遥控器动手修改，相机辅助可以告诉你下一个要按的键。在 Pro 的自动模式下，TameTV 会替你按键，并在最后一步修改前先征求你的同意。"
    - q: "TameTV 收集哪些数据？"
      a: "无需账号，没有广告。遥控指令从手机直接发到电视，配对记录留在你的设备上。iOS 上，Firebase 使用统计和崩溃报告默认开启，可在“设置 > 隐私 > 共享使用数据”中关闭；Android 上，只有你打开这个设置后才会发送。Google Cast 另有自己的诊断数据收集。详情见隐私政策。"
