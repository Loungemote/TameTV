  note: Android 的“共享使用数据”默认关闭，当前发布版本未配置 Firebase。iOS 的 Firebase 使用统计和崩溃报告默认开启，可在“设置 > 隐私 > 共享使用数据”中关闭，报告不包含电视名称、网络地址、输入文字或投放内容。Google Cast 有独立的诊断数据收集，不受这个开关控制。
faq:
  title: 常见问题
  more: 还有其他问题？请发邮件至
  items:
    - q: TameTV 免费吗？
      a: 下载、设置、用于确认连接的首次按键和演示电视免费，没有广告。控制电视、触控板、手机键盘、应用启动和媒体投放需要 TameTV Pro。可选周订阅（符合条件的新用户免费试用 3 天）、无试用期的年订阅或一次性买断，价格和优惠在付款前显示。Android 通过 Google Play 购买，iOS 通过 App Store 购买。Siri 和快捷指令仅适用于 iOS。
    - q: 支持哪些电视？
      a: 三星 Tizen 智能电视（2016 年及以后）、LG webOS 电视、索尼 Bravia、小米 PatchWall 电视、海信 VIDAA 电视、飞利浦 Titan OS 和 Saphi 电视、Android TV 和 Google TV 设备、Roku、Amazon Fire TV、Vizio SmartCast，以及 Apple TV HD 和 Apple TV 4K。TCL 等品牌的 Roku TV 和 Google TV 机型同样适用。不支持只能用红外遥控的电视。
    - q: TameTV 支持 Apple TV 吗？
      a: 支持 Apple TV HD 和 Apple TV 4K，Android、iPhone 和 iPad 都能用。输入 Apple TV 显示的配对码，只需一次。可以使用遥控按键、用手机键盘输入、打开应用，还能看到正在播放的内容和封面，播放、暂停、快进快退和静音。照片和视频请用 AirPlay 发送到 Apple TV，不经过 TameTV。
    - q: 需要红外发射器或万能遥控器吗？
      a: 不需要。TameTV 通过家里的 Wi-Fi 控制智能电视，不使用红外，所以无法控制只能用红外遥控的老电视。
    - q: 找不到电视怎么办？
      a: 确认电视已开机，和手机连接同一个 Wi-Fi；访客网络可能阻止设备互连。Android 请在 App 请求时允许“附近的设备”权限；iOS 请在“设置 > 隐私与安全性 > 本地网络”中打开 TameTV。仍找不到时，可按 IP 地址添加电视。
    - q: 能用手机开机吗？
      a: 很多电视可以。先在电视上打开网络唤醒设置，例如三星的 Power On with Mobile、LG 的 Turn on via Wi-Fi、Roku TV 的 Fast TV start。
    - q: TameTV 收集哪些数据？
      a: 无需账号，没有广告，遥控指令从手机直接发到电视，配对记录留在设备上。Android 当前版本未配置 Firebase；iOS 提供默认开启、可关闭的 Firebase 使用统计和崩溃报告。Google Cast 另有 SDK 诊断数据收集，详情见隐私政策。
    - q: Android 和 iPhone 版都上线了吗？
      a: 都已上线。Android 版在 Google Play，支持 Android 8.0 及以上的手机和平板。iPhone 和 iPad 版在 App Store，需要 iOS 17 或 iPadOS 17 及以上版本。App 支持简体中文、繁体中文、英语、日语、韩语、德语、法语、西班牙语、葡萄牙语（巴西）、俄语和印尼语。
    - q: 媒体投放就是屏幕镜像吗？
      a: 媒体投放将选定的照片、视频、文件或支持的链接发送到兼容设备。屏幕镜像使用手机系统功能：Android 系统投屏或 iOS AirPlay，是否可用取决于手机和电视。TameTV 不提供独立的屏幕镜像服务。
    - q: 如何恢复购买或取消 Pro 订阅？
      a: 使用付款时的商店账号，在 App 中选择“恢复购买”。Android 订阅在 Google Play 管理，iOS 订阅在 Apple 系统设置管理。删除 App 不会取消订阅，Google Play 和 App Store 之间的购买不互通。
