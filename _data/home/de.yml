faq:
  title: Häufige Fragen
  more: Noch Fragen? Schreib uns an
  items:
    - q: "Ist TameTV kostenlos?"
      a: "Ja. Die Fernbedienung mit allen Grundtasten ist kostenlos, ohne Werbung und ohne Testzeitraum. Steuerkreuz, OK, Zurück, Home, Lautstärke, Stumm, Sender, Ein/Aus und Wiedergabetasten, das einfache Layout, die Optimierung und der geführte Modus des Kamera-Assistenten kosten nichts. TameTV Pro bringt Sprachsuche, Handytastatur, Apps, Touchpad, Streamen, Leise Werbung und mehr. Zur Wahl stehen ein Wochenabo mit 3 Tagen Probezeit für berechtigte Neukunden, ein Jahresabo oder ein einmaliger Kauf auf Lebenszeit. Preise und Angebote werden vor der Zahlung angezeigt."
    - q: "Welche Fernseher werden unterstützt?"
      a: "Samsung-Smart-TVs von 2010 bis 2013 und ab 2016, LG-Fernseher mit webOS, Sony Bravia, Panasonic VIERA ab 2011, Xiaomi-Fernseher mit PatchWall, Hisense-Fernseher mit VIDAA, Philips-Fernseher mit Titan OS oder Saphi, Android-TV- und Google-TV-Geräte, Roku, Amazon Fire TV, Vizio SmartCast sowie Apple TV HD und Apple TV 4K. Roku TV-, Google TV- und Fire TV-Modelle anderer Marken wie TCL, Insignia, Toshiba und Sharp funktionieren auch. Samsung-Fernseher von 2014 und 2015 und Fernseher, die nur Infrarot verstehen, werden nicht unterstützt."
    - q: "Die App findet meinen Fernseher nicht. Was tun?"
      a: "Lass den Fernseher eingeschaltet und verbinde ihn mit demselben WLAN wie dein Handy; Gastnetzwerke können die Suche blockieren. Erlaube unter Android „Geräte in der Nähe“, wenn die App fragt. Aktiviere unter iOS TameTV in Einstellungen > Datenschutz & Sicherheit > Lokales Netzwerk. Erscheint der Fernseher immer noch nicht, wähle in der App seine Marke, um die passende Einstellung zu sehen, oder füge ihn per IP-Adresse hinzu."
    - q: "Kann ich den Fernseher mit dem Handy einschalten?"
      a: "Bei vielen Fernsehern ja. Schalte vorher am Fernseher das Einschalten über das Netzwerk ein, zum Beispiel Power On with Mobile bei Samsung, Turn on via Wi-Fi bei LG, Fast TV start bei Roku TV oder Powered On by Apps bei Panasonic. Samsung-Fernseher von 2010 bis 2013 lassen sich nicht über das Netzwerk einschalten. Die Namen können je nach Modell und Sprache abweichen."
    - q: "Was ändert die Optimierung an meinem Fernseher?"
      a: "Von selbst nichts. Die Optimierung zeigt dir den Menüpfad für jede Einstellung, etwa die, mit der dein Fernseher teilt, was du siehst, und sagt dir, was du verlierst, wenn du sie ausschaltest. Du änderst sie mit der Fernbedienung, und der Kamera-Assistent kann dir die nächste Taste zeigen. Im automatischen Modus von Pro drückt TameTV die Tasten und fragt vor der letzten Änderung nach."
    - q: "Welche Daten erhebt TameTV?"
      a: "Kein Konto und keine Werbung. Befehle gehen direkt vom Handy zum Fernseher, Kopplungsdaten bleiben auf deinem Gerät. Unter iOS sind Firebase-Nutzungsstatistiken und Absturzberichte standardmäßig an und lassen sich unter Einstellungen > Datenschutz > Nutzungsdaten teilen ausschalten; unter Android werden sie nur gesendet, wenn du diese Einstellung einschaltest. Google Cast erhebt eigene Diagnosedaten. Details stehen in der Datenschutzerklärung."
