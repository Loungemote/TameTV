tvs:
  title: Works with the TV you have.
  lead: TameTV speaks each TV's own network language, so there's nothing to plug in.
  footnote: Roku TV, Google TV and Fire TV models from TCL, Insignia, Toshiba, Sharp and others work too. Casting isn't available on Fire TV; Apple TV takes photos and videos over AirPlay. Infrared-only TVs aren't supported.
faq:
  title: Questions, answered.
  more: Something else? Email us at
  items:
    - q: Is TameTV free?
      a: Yes, the basic remote is free and has no ads, with no trial clock. The D-pad, OK, Back, Home, volume, mute, channel, power and playback keys, the simple layout, Tune-up and Camera Assist's guided mode are free. TameTV Pro adds voice search, the phone keyboard, apps, the touchpad, casting, Quiet Ads and more. Choose a weekly plan with a 3-day trial for eligible new subscribers, a yearly plan or a one-time lifetime purchase. Prices and offers appear before payment.
    - q: Which TVs work with TameTV?
      a: Samsung smart TVs with Tizen (2016 and later), LG webOS TVs, Sony Bravia, Xiaomi TVs with PatchWall, Hisense TVs with VIDAA, Philips TVs with Titan OS or Saphi, Android TV and Google TV devices, Roku, Amazon Fire TV, Vizio SmartCast, and Apple TV HD and Apple TV 4K. Roku TV, Google TV and Fire TV models from other brands, such as TCL, Insignia, Toshiba and Sharp, work too. Infrared-only TVs are not supported.
    - q: Does TameTV work with Apple TV?
      a: Yes, with Apple TV HD and Apple TV 4K, on Android as well as iPhone and iPad. Pair once with the code that the Apple TV shows. You get the remote keys, typing, apps, and what's playing with play, pause, skip and mute. Apple TV takes photos and videos over AirPlay rather than from TameTV.
    - q: Do I need an IR blaster or a universal remote?
      a: No. TameTV controls smart TVs over your home Wi-Fi. It does not use infrared, so it cannot control older TVs that only accept an infrared remote.
    - q: The app can't find my TV. What should I do?
      a: Keep the TV on and connect it to the same Wi-Fi as your phone; guest networks can block discovery. On Android, allow Nearby devices when asked. On iOS, turn on TameTV in Settings > Privacy & Security > Local Network. If the TV still doesn't show up, pick its brand in the app to see the setting to turn on, or add the TV by its IP address.
    - q: Can I turn my TV on with my phone?
      a: On many TVs, yes. First turn on the TV's network wake setting, such as Power On with Mobile on Samsung, Turn on via Wi-Fi on LG or Fast TV start on Roku TV.
    - q: What does Tune-up change on my TV?
      a: Nothing by itself. Tune-up shows the menu path for each setting, such as the one that shares what you watch, and says what you lose by turning it off. You make the change with the remote, and Camera Assist can show the next key. In Pro's automatic mode, TameTV presses the keys and asks before the final change.
    - q: What data does TameTV collect?
      a: There's no account and no ads. Remote commands go directly from your phone to the TV, and pairing records stay on your device. On iOS, Firebase usage and crash reports are on by default and can be turned off in Settings > Privacy > Share Usage Data; on Android they're off unless you turn that setting on. Google Cast collects separate diagnostics. See the privacy policy for details.
    - q: Is TameTV available for Android and iPhone?
      a: Yes. Android is on Google Play for phones and tablets running Android 8.0 or later. iPhone and iPad are on the App Store and need iOS 17 or iPadOS 17 or later. The app speaks English, Chinese (Simplified and Traditional), Japanese, Korean, German, French, Spanish, Portuguese (Brazil), Russian and Indonesian.
    - q: How do I restore or cancel Pro?
      a: Use Restore Purchases in the app with the store account you paid with. Manage Android subscriptions in Google Play and iOS subscriptions in Apple Settings. Deleting the app does not cancel a subscription. Purchases do not transfer between Google Play and the App Store.
