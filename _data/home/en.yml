privacy:
  title: No account. <em>No ads.</em>
  lead: A remote has no reason to know who you are.
  link: Read the privacy policy
  items:
    - { icon: "wifi", title: "Keys stay on your Wi-Fi", text: "They go straight from your phone to your TV, except while you help family over FaceTime." }
    - { icon: "mic", title: "Camera and mic work on your phone", text: "Camera Assist and Quiet Ads work on the phone and save no images or sound. Voice search uses your phone's own speech recognition." }
    - { icon: "lock", title: "Pairing stays with you", text: "Pairing keys live in the iOS Keychain or Android Keystore. They're never sent to us." }
  note: On iPhone and iPad, usage statistics and crash reports are on by default; turn them off in Settings > Privacy > Share Usage Data. On Android they're sent only if you turn that setting on. Google Cast and, on Android, Google's text recognition send their own diagnostics to Google.
tvs:
  title: Works with the TV you have.
  lead: TameTV speaks each TV's own network language, so there's nothing to plug in.
  footnote: Roku TV, Google TV and Fire TV models from TCL, Insignia, Toshiba, Sharp and others work too. Casting isn't available on Fire TV; Apple TV takes photos and videos over AirPlay. Samsung TVs from 2014 and 2015, and TVs that only take infrared, aren't supported.
faq:
  title: Questions, answered.
  more: Something else? Email us at
  items:
    - q: Is TameTV free?
      a: Yes, the basic remote is free and has no ads, with no trial clock. The D-pad, OK, Back, Home, volume, mute, channel, power and playback keys, the simple layout, Tune-up and Camera Assist's guided mode are free. TameTV Pro adds voice search, the phone keyboard, apps, the touchpad, casting, Quiet Ads and more. Choose a weekly plan with a 3-day trial for eligible new subscribers, a yearly plan or a one-time lifetime purchase. Prices and offers appear before payment.
    - q: Which TVs work with TameTV?
      a: Samsung smart TVs from 2010 to 2013 and from 2016 on, LG webOS TVs, Sony Bravia, Panasonic VIERA from 2011 on, Xiaomi TVs with PatchWall, Hisense TVs with VIDAA, Philips TVs with Titan OS or Saphi, Android TV and Google TV devices, Roku, Amazon Fire TV, Vizio SmartCast, and Apple TV HD and Apple TV 4K. Roku TV, Google TV and Fire TV models from other brands, such as TCL, Insignia, Toshiba and Sharp, work too. Samsung TVs from 2014 and 2015, and TVs that only take infrared, are not supported.
    - q: The app can't find my TV. What should I do?
      a: Keep the TV on and connect it to the same Wi-Fi as your phone; guest networks can block discovery. On Android, allow Nearby devices when asked. On iOS, turn on TameTV in Settings > Privacy & Security > Local Network. If the TV still doesn't show up, pick its brand in the app to see the setting to turn on, or add the TV by its IP address.
    - q: Can I turn my TV on with my phone?
      a: On many TVs, yes. First turn on the TV's network wake setting, such as Power On with Mobile on Samsung, Turn on via Wi-Fi on LG, Fast TV start on Roku TV or Powered On by Apps on Panasonic. Samsung TVs from 2010 to 2013 can't be turned on over the network.
    - q: What does Tune-up change on my TV?
      a: Nothing by itself. Tune-up shows the menu path for each setting, such as the one that shares what you watch, and says what you lose by turning it off. You make the change with the remote, and Camera Assist can show the next key. In Pro's automatic mode, TameTV presses the keys and asks before the final change.
    - q: What data does TameTV collect?
      a: There's no account and no ads. Remote commands go directly from your phone to the TV, and pairing records stay on your device. On iOS, Firebase usage and crash reports are on by default and can be turned off in Settings > Privacy > Share Usage Data; on Android they're off unless you turn that setting on. Google Cast collects separate diagnostics. See the privacy policy for details.
