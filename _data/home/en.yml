# The first of the two big promises: the TV works for you again.
tune:
  title: Make your TV <em>yours again</em>.
  lead: Smart TVs share what you watch and fill the home screen with ads. Tune-up walks you through your TV's own menus to turn that off, step by step. Free on Samsung, LG, Roku, Google TV and more.
  checks: ["Stop sharing what you watch", "Limit ad tracking", "Turn off motion smoothing", "Network debugging is off"]
  alt: "Tune-up: seven of ten things done, with privacy, picture and sound checks and what to do next."
  items:
    - { icon: "camera", title: "Camera Assist", text: "Point your phone at the TV's menu, and it shows which key to press next." }
    - { icon: "eyeoff", title: "Clean up this TV", text: "On Google TV and Android TV, turn off the ad and tracking apps you don't use. Nothing is deleted." }
    - { icon: "shield", title: "See what your router blocks", text: "Check which of your TV's tracking addresses your home network already blocks, and how to block the rest." }
    - { icon: "bell", title: "A heads-up when it matters", text: "After an ADB cleanup, check that casting still works. Hear about it when network debugging stays on." }
# The second big promise: everyone at home can use the TV.
family:
  title: Easy for everyone at home.
  lead: For the people who just want the TV on, and the ones who call you when it isn't.
  cards:
    - { kind: "help", title: "Help family over FaceTime", text: "On a call, press the keys on a relative's TV from your phone. Being helped is free.", note: "iPhone and iPad" }
    - { kind: "simple", title: "Grandparent mode", text: "Big keys with their names on them, and nothing else on screen to get lost in.", key: "Louder" }
    - { kind: "kids", title: "Kids' TV time", text: "Set a bedtime for school nights and one for weekends. The TV turns off on time.", time: "8:30 PM", note: "On iPhone, with a Shortcuts automation" }
