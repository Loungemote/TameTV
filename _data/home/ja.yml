faq:
  title: よくある質問
  more: ほかにご質問があれば、こちらへメールでどうぞ：
  items:
    - q: TameTVは無料ですか？
      a: はい。基本のリモコンは無料で、広告もお試し期間の制限もありません。方向キー、OK、戻る、ホーム、音量、消音、チャンネル、電源、再生キー、シンプルな配置、チューンアップ、カメラアシストのガイドモードは無料です。TameTV Proでは、音声検索、スマホのキーボード、アプリ、タッチパッド、キャスト、広告音量ダウンなどが使えます。週額プラン（対象の新規登録者は3日間無料）、年額プラン、買い切りから選べます。価格や特典はお支払い前に表示されます。
    - q: どのテレビに対応していますか？
      a: Samsung（Tizen、2016年以降）、LG（webOS）、Sony Bravia、Xiaomi（PatchWall）、Hisense（VIDAA）、Philips（Titan OS、Saphi）、Android TVとGoogle TVの端末、Roku、Amazon Fire TV、Vizio SmartCast、Apple TV HDとApple TV 4Kに対応します。TCL、Insignia、Toshiba、Sharpなど他ブランドのRoku TV、Google TV、Fire TV搭載モデルにも対応します。赤外線操作のみのテレビには対応していません。
    - q: Apple TVで使えますか？
      a: はい。Apple TV HDとApple TV 4Kに、AndroidでもiPhone・iPadでも対応します。Apple TVに表示されるコードで一度ペアリングするだけです。リモコンキー、文字入力、アプリに加えて、再生中の作品の表示と、再生、一時停止、スキップ、消音ができます。写真や動画はTameTVではなく、AirPlayでApple TVに送ります。
    - q: 赤外線アダプタや学習リモコンは必要ですか？
      a: 不要です。TameTVはご家庭のWi-Fiでスマートテレビを操作します。赤外線は使わないため、赤外線リモコンでしか操作できない古いテレビには使えません。
    - q: テレビが見つからないときは？
      a: テレビの電源を入れたまま、スマホと同じWi-Fiに接続してください。ゲストネットワークでは見つからないことがあります。Androidでは、求められたら「付近のデバイス」を許可します。iOSでは「設定 > プライバシーとセキュリティ > ローカルネットワーク」でTameTVをオンにします。それでも見つからないときは、アプリでテレビのブランドを選ぶとオンにする設定が表示されます。IPアドレスで追加することもできます。
    - q: スマホでテレビの電源を入れられますか？
      a: 多くのテレビで可能です。先にテレビでネットワーク経由の起動設定をオンにしてください。例：SamsungのPower On with Mobile、LGのTurn on via Wi-Fi、Roku TVのFast TV start。
    - q: チューンアップはテレビの何を変えますか？
      a: 勝手には何も変えません。チューンアップは、視聴内容の共有などの設定ごとにメニューの場所と、オフにすると何ができなくなるかを示します。変更はご自身でリモコンを使って行い、カメラアシストが次に押すキーを示します。Proの自動モードでは、TameTVがキーを押し、最後の変更の前に確認します。
    - q: どんなデータを収集しますか？
      a: アカウントも広告もありません。リモコン操作はスマホからテレビへ直接届き、ペアリング情報は端末内に残ります。iOSでは、Firebaseの利用統計とクラッシュレポートが初期設定でオンで、「設定 > プライバシー > 使用状況データを共有」でオフにできます。Androidでは、その設定をオンにしない限り送信されません。Google Castは別途、診断データを収集します。詳しくはプライバシーポリシーをご覧ください。
    - q: Android版とiPhone版はありますか？
      a: はい。Android版はGoogle Playで、Android 8.0以降のスマホとタブレットに対応します。iPhone・iPad版はApp Storeで、iOS 17またはiPadOS 17以降が必要です。アプリは日本語、英語、中国語（簡体字・繁体字）、韓国語、ドイツ語、フランス語、スペイン語、ポルトガル語（ブラジル）、ロシア語、インドネシア語に対応しています。
    - q: Proの復元や解約はどうしますか？
      a: 支払いに使ったストアアカウントで、アプリの「購入を復元」を使ってください。Androidの定期購入はGoogle Play、iOSの定期購入はAppleの設定で管理します。アプリを削除しても定期購入は解約されません。Google PlayとApp Storeの間で購入は引き継げません。
