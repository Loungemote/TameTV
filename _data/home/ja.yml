faq:
  title: よくある質問
  more: ほかにご質問があれば、こちらへメールでどうぞ：
  items:
    - q: "TameTVは無料ですか？"
      a: "はい。基本のリモコンは無料で、広告もお試し期間の制限もありません。方向キー、OK、戻る、ホーム、音量、消音、チャンネル、電源、再生キー、シンプルな配置、チューンアップ、カメラアシストのガイドモードは無料です。TameTV Proでは、音声検索、スマホのキーボード、アプリ、タッチパッド、キャスト、CMの音を抑えるなどが使えます。週額プラン（対象の新規登録者は3日間無料）、年額プラン、買い切りから選べます。価格や特典はお支払い前に表示されます。"
    - q: "どのテレビに対応していますか？"
      a: "Samsung（2010〜2013年と2016年以降のスマートテレビ）、LG（webOS）、Sony Bravia、Panasonic VIERA（2011年以降）、Xiaomi（PatchWall）、Hisense（VIDAA）、Philips（Titan OS、Saphi）、Android TVとGoogle TVの端末、Roku、Amazon Fire TV、Vizio SmartCast、Apple TV HDとApple TV 4Kに対応します。TCL、Insignia、Toshiba、Sharpなど他ブランドのRoku TV、Google TV、Fire TV搭載モデルにも対応します。2014年と2015年のSamsungテレビと、赤外線操作のみのテレビには対応していません。"
    - q: "テレビが見つからないときは？"
      a: "テレビの電源を入れたまま、スマホと同じWi-Fiに接続してください。ゲストネットワークでは見つからないことがあります。Androidでは、求められたら「付近のデバイス」を許可します。iOSでは「設定 > プライバシーとセキュリティ > ローカルネットワーク」でTameTVをオンにします。それでも見つからないときは、アプリでテレビのブランドを選ぶとオンにする設定が表示されます。IPアドレスで追加することもできます。"
    - q: "スマホでテレビの電源を入れられますか？"
      a: "多くのテレビで可能です。先にテレビでネットワーク経由の起動設定をオンにしてください。例：SamsungのPower On with Mobile、LGのTurn on via Wi-Fi、Roku TVのFast TV start、PanasonicのPowered On by Apps。2010〜2013年のSamsungテレビは、ネットワーク経由では電源を入れられません。"
    - q: "チューンアップはテレビの何を変えますか？"
      a: "勝手には何も変えません。チューンアップは、視聴内容の共有などの設定ごとにメニューの場所と、オフにすると何ができなくなるかを示します。変更はご自身でリモコンを使って行い、カメラアシストが次に押すキーを示します。Proの自動モードでは、TameTVがキーを押し、最後の変更の前に確認します。"
    - q: "どんなデータを収集しますか？"
      a: "アカウントも広告もありません。リモコン操作はスマホからテレビへ直接届き、ペアリング情報は端末内に残ります。iOSでは、Firebaseの利用統計とクラッシュレポートが初期設定でオンで、「設定 > プライバシー > 使用状況データを共有」でオフにできます。Androidでは、その設定をオンにしない限り送信されません。Google Castは別途、診断データを収集します。詳しくはプライバシーポリシーをご覧ください。"
